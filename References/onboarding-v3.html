<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LIFEOS · Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F3EC;--ink:#15171C;--ink2:#5B606B;--line:rgba(21,23,28,.12);--study:#BFD0FF;--studyd:#2A3FA8;--focus:#FFD98A;--focusd:#8A5A00;--health:#B9E6B0;--healthd:#1F6B2E;--sleep:#CFC4F5;--sleepd:#4B3A9A;--money:#A9E3DC;--moneyd:#0F6B63;--goals:#FFC1B0;--goalsd:#A33A20;--e:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}body{background:var(--paper);color:var(--ink);font:400 17px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.num{font-family:Geist,Inter,sans-serif;font-variant-numeric:tabular-nums;font-weight:600}
@property --c{syntax:'<color>';inherits:true;initial-value:#8a8f9a}
.hx{position:relative;height:100vh;height:100svh;display:flex;align-items:center;overflow:hidden}
.mark{position:absolute;z-index:3;top:26px;left:4vw;font:600 15px Geist,sans-serif;letter-spacing:.18em}
.skipt{position:absolute;z-index:3;top:20px;right:4vw;background:none;border:0;cursor:pointer;font:500 13.5px Inter,sans-serif;color:var(--ink2);padding:8px 6px;border-radius:8px}
.skipt:hover{color:var(--ink)}
.mesh{position:absolute;inset:-10%;z-index:0}
.mesh i{position:absolute;width:36vw;height:36vw;border-radius:50%;filter:blur(90px);opacity:.5;animation:dr 22s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate3d(6vw,-4vw,0) scale(1.15)}}
.spot{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(420px circle at var(--sx,70%) var(--sy,40%),rgba(255,255,255,.7),transparent 60%)}
.in{position:relative;z-index:2;width:min(1240px,92vw);margin:auto;display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,3.5vw,48px);align-items:center;height:100%;min-height:0;padding:clamp(46px,8vh,84px) 0 clamp(12px,3vh,30px)}
.lc{min-width:0;max-width:600px}

/* step pill + headline */
.pill{display:inline-flex;gap:12px;align-items:center;border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:999px;padding:6px 14px;font-size:14px;backdrop-filter:blur(8px)}
.pbar{display:flex;gap:4px}.pbar i{width:20px;height:3px;border-radius:3px;background:rgba(21,23,28,.14);transition:background .4s var(--e)}.pbar i.on{background:var(--ink)}
h1{font:400 clamp(30px,min(5.2vw,8vh),80px)/.98 'Instrument Serif',Georgia,serif;letter-spacing:-.02em;margin:clamp(6px,1.6vh,18px) 0 clamp(6px,1.2vh,12px)}
h1 .ml{display:block;overflow:hidden;padding:.04em 0 .1em}
h1 .ml>span{display:inline-block;transform:translateY(112%);animation:up .9s var(--e) forwards;animation-delay:calc(.12s*var(--i) + .05s)}
h1 em{font-style:italic}
.hl{position:relative;display:inline-block;isolation:isolate}
.hl::after{content:"";position:absolute;left:-.04em;right:-.04em;bottom:.1em;height:.34em;background:var(--focus);z-index:-1;border-radius:.1em;transform:scaleX(0);transform-origin:left;animation:sx .8s var(--e) .55s forwards}
@keyframes up{to{transform:none}}@keyframes sx{to{transform:scaleX(1)}}@keyframes fade{from{opacity:0;transform:translateY(12px)}}
.sub{color:var(--ink2);max-width:46ch;font-size:clamp(13px,2vh,17px);margin-bottom:clamp(8px,1.8vh,18px)}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink2);margin:0 2px 10px}
.meta b{color:var(--ink);font-family:Geist,sans-serif;font-weight:600}

/* ============ premium option boxes ============ */
.opts{display:grid;gap:12px;padding:4px;margin:-4px}
.g1{grid-template-columns:1fr 1fr}.g2{gap:10px}
.opt{all:unset;box-sizing:border-box;position:relative;isolation:isolate;display:grid;align-items:center;cursor:pointer;border-radius:20px;
 --ring:linear-gradient(150deg,rgba(255,255,255,.95),rgba(21,23,28,.07) 60%);
 background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.6));
 box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(21,23,28,.05),0 18px 32px -22px rgba(21,23,28,.42);
 -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
 transition:transform .45s var(--e),box-shadow .45s var(--e),background .35s,opacity .3s}
.opt::before,.opt::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.opt::before{background:var(--ring)}
.opt::after{background:radial-gradient(150px circle at var(--mx,50%) var(--my,0%),var(--cd),transparent 72%);opacity:0;transition:opacity .35s}
.opt .sp{position:absolute;inset:0;border-radius:inherit;z-index:-1;background:radial-gradient(230px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--c) 42%,transparent),transparent 70%);opacity:0;transition:opacity .35s}
.opt:hover{transform:translateY(-2px)}.opt:hover::after{opacity:1}.opt:hover .sp{opacity:.85}
.opt:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.opt[aria-checked="true"]{background:linear-gradient(140deg,color-mix(in srgb,var(--c) 34%,#fff),rgba(255,255,255,.97) 74%);transform:translateY(-2px);
 box-shadow:inset 0 1px 0 #fff,0 0 0 4px color-mix(in srgb,var(--c) 26%,transparent),0 26px 40px -24px var(--cd)}
.opt[aria-checked="true"]::after{background:linear-gradient(135deg,var(--cd),color-mix(in srgb,var(--c) 55%,var(--cd)));opacity:1}
.opt.locked{opacity:.42;cursor:not-allowed}.opt.locked:hover{transform:none}.opt.locked:hover::after,.opt.locked:hover .sp{opacity:0}
.o1{grid-template-columns:auto 1fr auto auto;column-gap:12px;row-gap:clamp(7px,1.3vh,13px);padding:clamp(9px,1.6vh,14px) 14px;min-height:clamp(70px,12.4vh,96px);align-content:center}
.o1 .mt{grid-column:1/-1}
.o2{grid-template-columns:auto 1fr auto auto;column-gap:14px;padding:clamp(6px,1vh,11px) 16px clamp(6px,1vh,11px) 12px;min-height:clamp(46px,8.2vh,66px)}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:var(--cd);box-shadow:inset 0 1px 0 rgba(255,255,255,.7);transition:background .4s,color .3s,box-shadow .4s}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.opt[aria-checked="true"] .ico{background:linear-gradient(145deg,color-mix(in srgb,var(--cd) 78%,#fff),var(--cd));color:#fff;box-shadow:0 10px 18px -8px var(--cd),inset 0 1px 0 rgba(255,255,255,.35)}
.ico.zapd{animation:zi .7s var(--e)}@keyframes zi{0%{box-shadow:0 0 0 0 var(--cd)}30%{box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 70%,transparent),0 0 22px var(--cd)}100%{}}
.tx{min-width:0}.lbl{display:block;font:600 15.5px/1.25 Geist,sans-serif;letter-spacing:-.01em}
.sb{display:flex;align-items:center;font-size:12.5px;color:var(--ink2);margin-top:2px;white-space:nowrap}.sb b{font:600 12.5px Geist,sans-serif;color:var(--ink);margin-left:4px}
.o2 .sb{white-space:normal}
.gn{font:600 11.5px Geist,sans-serif;color:var(--healthd);background:rgba(185,230,176,.55);border-radius:999px;padding:1px 8px;margin-left:0;max-width:0;opacity:0;overflow:hidden;transition:max-width .5s var(--e),opacity .4s,margin .4s}
.gn.has{max-width:70px;opacity:1;margin-left:8px}
.key{font:500 11px Inter,sans-serif;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:0 6px;line-height:18px;background:rgba(255,255,255,.6)}
.tick{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(21,23,28,.2);display:grid;place-items:center;transition:background .3s,border-color .3s,transform .4s var(--e)}
.tick svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .45s var(--e) .08s}
.opt[aria-checked="true"] .tick{background:var(--cd);border-color:var(--cd);transform:scale(1.08)}.opt[aria-checked="true"] .tick svg{stroke-dashoffset:0}
.mt{position:relative;height:6px;border-radius:6px;background:rgba(21,23,28,.08);overflow:hidden}
.mt i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--b)*1%);background:color-mix(in srgb,var(--c) 85%,#fff);border-radius:6px;transition:width .8s var(--e)}
.mt u{position:absolute;top:0;bottom:0;left:calc(var(--b)*1%);width:calc((var(--p) - var(--b))*1%);background:repeating-linear-gradient(115deg,var(--cd) 0 6px,color-mix(in srgb,var(--cd) 65%,#fff) 6px 12px);background-size:24px 100%;animation:mv 1s linear infinite;transition:width .8s var(--e),left .8s var(--e)}
@keyframes mv{to{background-position:24px 0}}
.dots{display:flex;padding-left:3px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--cx);margin-left:-3px;box-shadow:0 0 0 2px #fff}

/* actions */
.cta{display:flex;gap:22px;align-items:center;margin:clamp(10px,2vh,22px) 0 0;flex-wrap:wrap}
.btn{all:unset;box-sizing:border-box;display:inline-flex;gap:10px;align-items:center;background:var(--ink);color:var(--paper);padding:clamp(9px,1.7vh,14px) 24px;border-radius:14px;cursor:pointer;font:500 16px Inter,sans-serif;position:relative;overflow:hidden;transition:transform .2s var(--e),box-shadow .3s,opacity .3s;box-shadow:0 12px 30px -10px rgba(21,23,28,.5)}
.btn::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s var(--e)}
.btn:hover::before{transform:translateX(120%)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--e)}.btn:hover svg{transform:translateX(5px)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn[aria-disabled="true"]{opacity:.38;cursor:not-allowed;box-shadow:none}
.skip{all:unset;cursor:pointer;color:var(--ink2);font-size:15px;text-underline-offset:4px;padding:8px 2px;border-radius:8px}.skip:hover{color:var(--ink);text-decoration:underline}.skip:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* ============ summary card (step 3) ============ */
.sum{position:relative;isolation:isolate;border-radius:24px;padding:20px 22px 18px;background:linear-gradient(160deg,rgba(255,255,255,.96),rgba(255,255,255,.72));-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
 box-shadow:inset 0 1px 0 #fff,0 2px 4px rgba(21,23,28,.04),0 34px 60px -34px var(--cd)}
.sum::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(140deg,var(--cd),rgba(255,255,255,.7) 45%,color-mix(in srgb,var(--c) 70%,#fff));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.sum::after{content:"";position:absolute;z-index:-1;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 70%,transparent),transparent 68%);opacity:.7}
.sm-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:8px;font:600 13px Geist,sans-serif;padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--c) 55%,#fff);color:var(--cd)}.tag i{width:7px;height:7px;border-radius:50%;background:var(--cd)}
.ov{font-size:13px;color:var(--ink2)}.ov b{color:var(--ink)}
.sm-h{font:400 clamp(26px,3.6vh,34px)/1.1 'Instrument Serif',Georgia,serif;letter-spacing:-.01em;margin-bottom:14px}.sm-h b{font-weight:400;font-style:italic}
.sm-mv{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.8);border:1px solid rgba(21,23,28,.07);box-shadow:0 14px 28px -22px rgba(21,23,28,.45)}
.sm-mv .ico{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,color-mix(in srgb,var(--cd) 78%,#fff),var(--cd));color:#fff;box-shadow:0 8px 16px -8px var(--cd)}
.sm-mv .k{display:block;font-size:11.5px;color:var(--ink2);letter-spacing:.02em}.sm-mv .v{display:block;font:600 15.5px Geist,sans-serif}
.est{margin-left:auto;font:600 12.5px Geist,sans-serif;color:var(--healthd);background:rgba(185,230,176,.55);border-radius:999px;padding:3px 10px;white-space:nowrap}
.sm-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.gc{--b:0;--p:0;padding:9px 11px 10px;border-radius:14px;background:rgba(255,255,255,.66);border:1px solid rgba(21,23,28,.07)}
.gc .r{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:7px}.gc .r i{width:7px;height:7px;border-radius:50%;background:var(--cd)}
.gc .r b{margin-left:auto;font:600 12.5px Geist,sans-serif;color:var(--healthd)}.gc.z .r b{color:var(--ink2);font-weight:500}
.gc .mt{display:block;height:5px}

/* ============ dial (same engine as hero) ============ */
.hr{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center}
.dial{position:relative;width:100%;max-width:clamp(250px,calc(100svh - 262px),620px);margin:0 auto;aspect-ratio:1;animation:rise 1.2s var(--e) .2s backwards}
@keyframes rise{from{opacity:0;transform:scale(.86) rotate(-14deg)}}
.dial>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arcs{filter:drop-shadow(0 12px 12px rgba(21,23,28,.18))}
.rc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.rc .num{display:block;font-size:clamp(40px,5vw,72px);line-height:1}.rc small{display:block;font-size:14px;color:var(--ink2)}
.dlt{position:absolute;left:50%;top:50%;margin:-62px 0 0 24px;font:600 12px Geist,sans-serif;color:#fff;background:var(--healthd);border-radius:999px;padding:2px 9px;opacity:0;pointer-events:none}
.pls{position:absolute;inset:0;pointer-events:none}
.pl{all:unset;box-sizing:border-box;position:absolute;transform:translate(-50%,-50%);display:flex;gap:7px;align-items:center;white-space:nowrap;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:500 clamp(11px,1.15vw,14px) Inter,sans-serif;color:var(--ink);box-shadow:0 12px 26px -12px rgba(21,23,28,.4);cursor:pointer;pointer-events:auto;transition:box-shadow .3s,color .3s,filter .3s;animation:pop .8s var(--e) backwards;animation-delay:calc(.6s + var(--i)*.1s)}
.pl:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.pl i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.pl s{display:none;text-decoration:line-through;color:var(--ink2);font:400 11px Inter,sans-serif}.pl.act s{display:inline}
.pl.on{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 40%,transparent),0 12px 26px -12px rgba(21,23,28,.4)}
.pl.dim{color:rgba(21,23,28,.42);filter:saturate(.5)}.pl.dim i{opacity:.5}
.pl.att{animation:pop .8s var(--e) backwards,pu 2.4s ease-in-out 2s infinite;animation-delay:calc(.6s + var(--i)*.1s),2s}
@keyframes pu{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 35%,transparent),0 12px 26px -12px rgba(21,23,28,.4)}}
@keyframes pop{from{opacity:0;scale:.6}}
.zg path{vector-effect:non-scaling-stroke}

/* insight card (same as hero, projection chart) */
.ghost{animation:gOut .42s cubic-bezier(.4,0,.2,1) forwards}@keyframes gOut{to{opacity:0}}
.enter{animation:eIn .6s cubic-bezier(.4,0,.2,1) .12s both}@keyframes eIn{from{opacity:0}}
.ins{position:relative;overflow:hidden;width:min(600px,100%);margin:clamp(4px,1vh,10px) auto 0;display:grid;grid-template-columns:clamp(130px,23vh,170px) 1fr;align-items:center;gap:4px;padding:10px 16px 10px 8px;border-radius:20px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(21,23,28,.08);box-shadow:0 1px 2px rgba(21,23,28,.05),0 24px 48px -24px rgba(21,23,28,.3);animation:fade .9s var(--e) 1.2s backwards}
.ins::before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at 14% 50%,color-mix(in srgb,var(--c,#8a8f9a) 24%,transparent),transparent 70%);pointer-events:none}
.rp{position:relative;aspect-ratio:1}.rp svg{width:100%;height:100%;overflow:visible}
.ed{fill:none;stroke-linecap:round;stroke-dasharray:2.5 4.5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}
.rp text{font:600 7px Inter,sans-serif;fill:var(--ink2);text-anchor:middle}
.rt{position:relative;min-width:0;display:flex;flex-direction:column;gap:6px}
.ins-top{display:flex;align-items:center;gap:8px;min-width:0}.ins-tile{display:grid;place-items:center;color:var(--c);flex:none}.ins-tile svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ins-top b{font:600 15px Geist,sans-serif}.ins-top small{font-size:12px;color:var(--ink2);white-space:nowrap}
.ins-s{margin-left:auto;font:600 12px Geist,sans-serif;white-space:nowrap}.ins-s.good{color:var(--healthd)}.ins-s.warn{color:var(--goalsd)}.ins-s.neutral{color:var(--ink2)}
.ins p{margin:0;font-size:12.5px;line-height:1.45;color:var(--ink);opacity:.78;min-height:2.9em}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.trio div{background:rgba(255,255,255,.8);border:1px solid rgba(21,23,28,.07);border-radius:12px;padding:4px 10px}.trio small{display:block;font:500 10.5px Inter,sans-serif;color:var(--ink2)}.trio b{font-size:18px;line-height:1.15}
.ef-l{display:flex;justify-content:space-between;gap:10px;font:500 10.5px Inter,sans-serif;color:var(--ink2)}#insBt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.eff{display:flex;gap:3px;height:7px}.eff i{flex:1 1 0;min-width:0;border-radius:5px;background:var(--cd)}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}@keyframes rot{to{--ang:360deg}}
.opt[aria-checked="true"]::after{background:conic-gradient(from var(--ang),var(--cd),color-mix(in srgb,var(--c) 35%,#fff),var(--cd) 50%,color-mix(in srgb,var(--c) 60%,var(--cd)),var(--cd));animation:rot 3s linear infinite}
.sum::before{background:conic-gradient(from var(--ang),var(--cd),rgba(255,255,255,.85),color-mix(in srgb,var(--c) 70%,#fff),var(--cd));animation:rot 5s linear infinite}
.gc{animation:fade .7s var(--e) backwards;animation-delay:calc(.3s + var(--n,0)*.07s)}
#ann{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:10;background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;pointer-events:none;transition:all .35s var(--e)}#toast.show{opacity:1;transform:translateX(-50%)}
.rm *,.rm *::before,.rm *::after{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}
@media(max-height:720px){.ico{width:34px;height:34px}.g2{gap:7px}.g1{gap:9px}}@media(max-height:640px){.sub{display:none}.sm-g{gap:6px}}
@media(max-width:900px){
 html,body{overflow:auto;height:auto}.hx{height:auto;min-height:100svh}.in{height:auto;grid-template-columns:1fr;padding-top:76px;padding-bottom:110px;gap:10px}
 .hr{order:-1}.dial{max-width:min(100%,340px)}.ins{display:none}
 .key{display:none}.sm-g{grid-template-columns:1fr 1fr}
 .cta{position:fixed;left:0;right:0;bottom:0;z-index:5;margin:0;padding:12px 4vw calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(246,243,236,.97) 60%,rgba(246,243,236,0))}
 .cta .btn{flex:1;justify-content:center}
}
@media(max-width:420px){.g1{grid-template-columns:1fr}}
</style>
</head>
<body>
<section class="hx" id="hx">
  <span class="mark">LIFEOS</span>

 ED.forEach(d=>{d.w+=(d.tw-d.w)*k;d.o+=(d.to-d.o)*k;d.e.setAttribute('stroke-width',d.w.toFixed(2));d.e.style.opacity=d.o.toFixed(2)});
 NO.forEach(n=>{n.r+=(n.tr-n.r)*k;n.o+=(n.to-n.o)*k;n.c.setAttribute('r',n.r.toFixed(2));const big=n.tr>6.5;n.h.setAttribute('r',(n.r+2.5+(big?pu*1.2:0)).toFixed(2));n.h.style.opacity=big?.5*n.o:0;n.g.style.opacity=n.o.toFixed(2)});
 EF.forEach((e,i)=>{ef[i]+=(eft[i]-ef[i])*k;efo[i]+=(efot[i]-efo[i])*k;e.style.flexGrow=ef[i].toFixed(3);e.style.opacity=efo[i].toFixed(2)});
 [nD,nR,nT].forEach((n,j)=>{nv[j]+=(nt[j]-nv[j])*(RM?1:.14);const x=nv[j],s=j===2?String(Math.round(x)):(x<.05?'0.0':'+'+x.toFixed(1));if(n.textContent!==s)n.textContent=s})}
const tone=v=>v>=TG?['Above target','good']:v>=72?['Close to target','neutral']:['Needs attention','warn'];
const split=i=>{const gain=M.P[i]-B[i],t=M.t[i];if(!(t>1e-6))return[0,0];const d=Math.min(gain,gain*M.g[i]/t);return[d,gain-d]};
function setIns(hi){const sig=[hi,M.plan,[...AS].join(),st.step].join('|');if(sig===shownI)return;const first=shownI==='';shownI=sig;
 const planned=AS.size>0,on=hi>=0&&AS.has(hi);
 ED.forEach(d=>{const f=d.c*M.t[d.j],rel=hi<0||d.i===hi||d.j===hi;d.tw=planned?clamp(.5+f*.5,.5,3.4):.5;d.to=planned?(f>.12?(rel?.95:.2):.1):(hi<0?.16:(rel?.45:.07))});
 NO.forEach((n,i)=>{const near=hi<0||i===hi||(planned&&ED.some(d=>((d.i===hi&&d.j===i)||(d.j===hi&&d.i===i))&&d.c*M.t[d.j]>.12));n.tr=planned?6+Math.min(7,M.G[i]*.5)+(AS.has(i)?1.5:0):6;n.to=near?1:.3});
 const tot=M.e.reduce((a,b)=>a+b)||1;M.e.forEach((e,i)=>{eft[i]=Math.max(.04,e/tot);efot[i]=hi<0||i===hi?1:.3});
 ins.style.setProperty('--c',hi>=0?`var(--${K[hi]}d)`:'#8a8f9a');
 if(!first){xfade(insP);xfade(insBt)}
 if(hi<0){const vals=planned?M.R:B,low=vals.indexOf(Math.min(...vals));let d=0,r=0;B.forEach((_,i)=>{const q=split(i);d+=q[0]/6;r+=q[1]/6});nt=[d,r,planned?M.plan:M.now];nTL.textContent='Balance';
  insTile.innerHTML=svgI(ICONS.All);insT.textContent='Ripple engine';insSub.textContent=planned?`${M.plan-M.now>=0?'+':'−'}${Math.abs(M.plan-M.now)} by week 6`:'';insS.textContent='';insS.className='ins-s';
  insP.textContent=planned?`Balance ${M.now} → ${M.plan} in six weeks. Lines show gains spilling between areas.`:'Pick an area and watch it charge. Lines show how gains spill between areas.';
  insBt.textContent=planned?`Weakest: ${N[low]} ${vals[low]}`:'';return}
 const b=B[hi],p=on?M.R[hi]:b,gap=TG-b,[lab,tn]=tone(p),q=on?split(hi):[0,0];nt=[q[0],q[1],p];nTL.textContent='Week 6';
 insTile.innerHTML=svgI(ICONS[N[hi]]);insT.textContent=N[hi];insSub.textContent=on?`${p-b>=0?'+':'−'}${Math.abs(p-b)} by week 6`:`Now ${b}`;insS.textContent=lab;insS.className='ins-s '+tn;
 if(on){let src=-1,bs=0;S[hi].forEach((c,j)=>{const v=c*M.t[j];if(v>bs){bs=v;src=j}});insP.textContent=`${N[hi]} starts ${gap>0?gap+' under':-gap+' above'} your target of ${TG}. Plan: ${p} by week 6`+(q[1]>=1.5&&src>=0?`, ${Math.round(q[1])} of it via ${N[src]}.`:'.')}
 else insP.textContent=`${N[hi]} sits at ${b}, ${gap>0?gap+' under':-gap+' above'} target. Add it to your picks to see what changes.`;
 insBt.textContent='Next: '+ACT[hi]}

/* ===================== STEPS ===================== */
const body=$('#body'),ttl=$('#ttl'),sub=$('#sub'),go=$('#go'),sec=$('#sec');
const setTitle=l=>ttl.innerHTML=l.map((x,i)=>`<span class="ml" style="--i:${i}"><span>${x}</span></span>`).join('');
const ann=t=>$('#ann').textContent=t;
function toast(t){const n=$('#toast');n.textContent=t;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2400)}
function goApp(){const detail={priorities:st.sel.map(i=>K[i]),challenge:st.ch,plan:{now:M.now,plan:M.plan,areas:Object.fromEntries(K.map((k,i)=>[k,{now:B[i],plan:M.R[i],gain:M.G[i]}]))}};
 document.dispatchEvent(new CustomEvent('lifeos:onboarding-complete',{detail}));toast('→ /app (router.push here in the Next.js port)')}
function lowest(){const pool=AS.size?[...AS]:[0,1,2,3,4,5];return pool.reduce((m,i)=>B[i]<B[m]?i:m,pool[0])}
function render(animate){
 const s=st.step;sync();
 $('#stepT').textContent=`Step ${s} of 3`;[...document.querySelectorAll('.pbar i')].forEach((n,j)=>n.classList.toggle('on',j<s));
 let html='';
 if(s===1){
  setTitle(['What matters most','<em class="hl">right now?</em>']);sub.textContent='Pick up to three areas. The dial shows what your plan could do for each.';
  html=`<div class="meta"><span id="cnt"></span><span>Press 1–6 to toggle</span></div><div class="opts g1" role="group" aria-label="Areas that matter most">`+
   N.map((n,i)=>`<button type="button" class="opt o1" data-i="${i}" role="checkbox" aria-checked="false" style="--c:var(--${K[i]});--cd:var(--${K[i]}d)"><span class="sp"></span><span class="ico">${svgI(ICONS[n])}</span><span class="tx"><span class="lbl">${n}</span><span class="sb">Now<b>${B[i]}</b><span class="gn"></span></span></span><span class="key">${i+1}</span><span class="tick">${CHECK}</span><span class="mt"><i></i><u></u></span></button>`).join('')+`</div>`;
  go.innerHTML='Continue '+ARROW;sec.textContent='';sec.style.display='none';
 }
 if(s===2){
  setTitle(['What’s your biggest','<em class="hl">challenge?</em>']);sub.textContent='We’ll point your first plan at the areas this touches most.';
  html=`<div class="meta"><span>Choose one</span><span>Press 1–5 to select</span></div><div class="opts g2" role="radiogroup" aria-label="Biggest challenge">`+
   CH.map((c,i)=>{const k=K[c.map[0]];return`<button type="button" class="opt o2" data-c="${c.id}" role="radio" aria-checked="${st.ch===c.id}" style="--c:var(--${k});--cd:var(--${k}d)"><span class="sp"></span><span class="ico">${svgI(ICONS[c.ico])}</span><span class="tx"><span class="lbl">${c.label}</span><span class="sb">${c.sub}</span></span><span class="dots" title="${c.map.map(j=>N[j]).join(', ')}">${c.map.slice(0,4).map(j=>`<i style="--cx:var(--${K[j]}d)"></i>`).join('')}</span><span class="tick">${CHECK}</span></button>`}).join('')+`</div>`;
  go.innerHTML='Continue '+ARROW;sec.textContent='← Back';sec.style.display='';
 }
 if(s===3){
  const low=lowest(),k=K[low];
  setTitle(['Your view is','<em class="hl">ready.</em>']);sub.textContent='Here is where your plan starts, based on what you told us.';
  html=`<div class="sum" style="--c:var(--${k});--cd:var(--${k}d)"><div class="sm-top"><span class="tag"><i></i>${N[low]} · ${B[low]}</span><span class="ov">Overall <b class="num" id="ovA">${M.now}</b> → <b class="num" id="ovB">${M.now}</b></span></div>
   <p class="sm-h">Start with <b>${N[low]} (${B[low]})</b>. Target ${TG}.</p>
   <div class="sm-mv"><span class="ico">${svgI(ICONS[N[low]])}</span><span class="tx"><span class="k">Next move</span><span class="v">${ACT[low]}</span></span><span class="est">+${M.G[low]} est.</span></div>
   <div class="sm-g">${N.map((n,i)=>`<div class="gc${M.G[i]?'':' z'}" style="--cd:var(--${K[i]}d);--c:var(--${K[i]});--b:${B[i]};--p:${M.R[i]};--n:${i}"><div class="r"><i></i>${n}<b>${M.G[i]?'+'+M.G[i]:'–'}</b></div><span class="mt"><i></i><u></u></span></div>`).join('')}</div></div>`;
  go.innerHTML='Open my LIFEOS '+ARROW;sec.textContent='Skip setup, open the demo';sec.style.display='';
 }
 const paint=()=>{body.innerHTML=html;refresh();
  if(s===3){const t=performance.now();[...AS].forEach((i,n)=>zt[i]=t+n*130);countUp($('#ovB'),M.now,M.plan,900)}};
 if(animate&&!RM){body.animate([{opacity:1,transform:'translateX(0)'},{opacity:0,transform:'translateX(-14px)'}],{duration:140,easing:'ease-in'}).onfinish=()=>{paint();body.animate([{opacity:0,transform:'translateX(18px)'},{opacity:1,transform:'none'}],{duration:320,easing:'cubic-bezier(.22,1,.36,1)'})}}else paint();
 go.setAttribute('aria-disabled',String(s===1?!st.sel.length:s===2?!st.ch:false));
 ann(`Step ${s} of 3`);
}
function countUp(n,a,b,ms){if(!n)return;if(RM||a===b){n.textContent=b;return}const t0=performance.now();(function f(now){const p=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-p,3);n.textContent=Math.round(a+(b-a)*e);if(p<1)requestAnimationFrame(f)})(t0)}
/* update numbers/meters on the left boxes without re-rendering them */
function refresh(){
 if(st.step===1){
  const c=$('#cnt');if(c)c.innerHTML=`<b>${st.sel.length}</b> of 3 chosen`;
  document.querySelectorAll('.o1').forEach(b=>{const i=+b.dataset.i,on=st.sel.includes(i),g=M.G[i];
   b.setAttribute('aria-checked',on);b.classList.toggle('locked',!on&&st.sel.length>=3);
   b.style.setProperty('--b',B[i]);b.style.setProperty('--p',on?M.R[i]:B[i]);
   const gn=b.querySelector('.gn');gn.textContent=on&&g>0?`+${g}`:gn.textContent;gn.classList.toggle('has',on&&g>0)})}
 if(st.step===2)document.querySelectorAll('.o2').forEach(b=>b.setAttribute('aria-checked',st.ch===b.dataset.c));
}
function zapIcon(b){const ic=b&&b.querySelector('.ico');if(!ic||RM)return;ic.classList.remove('zapd');void ic.offsetWidth;ic.classList.add('zapd')}

/* ===================== INTERACTIONS ===================== */
function toggle(i){
 st.touched=true;const k=st.sel.indexOf(i);
 if(k>-1)st.sel.splice(k,1);else{if(st.sel.length>=3){toast('Up to 3 areas. Untick one first.');return}st.sel.push(i);zt[i]=performance.now();st.last=i}
 if(k>-1&&st.last===i)st.last=-1;
 sync();refresh();go.setAttribute('aria-disabled',String(!st.sel.length));
 if(k<0)zapIcon(document.querySelector(`.o1[data-i="${i}"]`));
 ann(`${N[i]} ${k>-1?'removed':'selected'}. ${st.sel.length} of 3 chosen.`)}
function pick(id){
 st.touched=true;st.ch=id;sync();const t=performance.now(),c=CH.find(x=>x.id===id);c.map.forEach((i,n)=>zt[i]=t+n*90);st.last=c.map[0];
 refresh();go.setAttribute('aria-disabled','false');zapIcon(document.querySelector(`.o2[data-c="${id}"]`));ann('Challenge selected')}
function next(){
 if(go.getAttribute('aria-disabled')==='true'){toast(st.step===1?'Pick at least one area to continue.':'Choose a challenge to continue.');return}
 if(st.step===3){goApp();return}st.step++;st.pre=[];render(true)}
function back(){if(st.step>1){st.step--;st.pre=[];render(true)}}
body.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;if(b.dataset.i!==undefined)toggle(+b.dataset.i);else if(b.dataset.c)pick(b.dataset.c)});
body.addEventListener('pointerover',e=>{const b=e.target.closest('.opt');if(!b)return;st.pre=b.dataset.i!==undefined?[+b.dataset.i]:b.dataset.c?CH.find(x=>x.id===b.dataset.c).map:[]});
body.addEventListener('pointerleave',()=>st.pre=[]);
body.addEventListener('focusin',e=>{const b=e.target.closest('.opt');if(b)st.pre=b.dataset.i!==undefined?[+b.dataset.i]:CH.find(x=>x.id===b.dataset.c).map});
body.addEventListener('focusout',()=>st.pre=[]);
body.addEventListener('pointermove',e=>{const b=e.target.closest('.opt');if(!b)return;const r=b.getBoundingClientRect();b.style.setProperty('--mx',(e.clientX-r.left)+'px');b.style.setProperty('--my',(e.clientY-r.top)+'px')});
go.addEventListener('click',next);sec.addEventListener('click',()=>st.step===3?goApp():back());$('#skipT').addEventListener('click',goApp);
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key==='Escape'){goApp();return}
 if(e.key==='Enter'){if(e.target.closest&&e.target.closest('button'))return;e.preventDefault();next();return}
 const n=parseInt(e.key,10);if(st.step===1&&n>=1&&n<=6)toggle(n-1);if(st.step===2&&n>=1&&n<=5)pick(CH[n-1].id)});

/* ambient: light follows the pointer, CTA is magnetic, idle tour until the first pick */
if(!RM){const hx=$('#hx'),spot=$('#spot'),shc=$('#sh'),svg=$('#dsv');
 addEventListener('pointermove',e=>{const r=hx.getBoundingClientRect();spot.style.setProperty('--sx',(e.clientX-r.left)+'px');spot.style.setProperty('--sy',(e.clientY-r.top)+'px');
  const q=svg.getBoundingClientRect();shc.setAttribute('cx',(e.clientX-q.left)/q.width*340-170);shc.setAttribute('cy',(e.clientY-q.top)/q.height*340-170)});
 go.addEventListener('pointermove',e=>{const r=go.getBoundingClientRect();go.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.2}px,${(e.clientY-r.top-r.height/2)*.3}px)`});
 go.addEventListener('pointerleave',()=>go.style.transform='');
 (async()=>{const sl=ms=>new Promise(r=>setTimeout(r,ms));await sl(3200);for(let q=0;!st.touched;q=(q+1)%6){while(st.hovD>=0||st.pre.length)await sl(250);if(st.touched||st.step!==1)break;st.fx=[3,1,0,2,4,5][q];await sl(3200)}st.fx=-1})()}

render(false);requestAnimationFrame(frame);
})();
</script>
